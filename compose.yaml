services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: frankysapi_db
      POSTGRES_USER: frankysapi_user
      POSTGRES_PASSWORD: frankysapi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frankysapi -d frankysapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
